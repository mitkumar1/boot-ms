# Black Duck Detect Configuration
# This file configures Black Duck Detect for the Customer Service project

# Project Information
detect.project.name=customer-service-virtual-threads
detect.project.version.name=${BUILD_NUMBER:-1.0.0}
detect.project.description=Spring Boot Customer Service with Java 21 Virtual Threads

# Source Configuration
detect.source.path=.
detect.maven.build.command=compile
detect.maven.path=mvn
detect.maven.excluded.scopes=test

# Detection Configuration
detect.detector.search.depth=10
detect.detector.search.exclusion.patterns=**/target/**,**/node_modules/**,**/.git/**,**/bin/**,**/.mvn/**

# Black Duck Configuration
detect.blackduck.signature.scanner.paths=src/main/java,src/main/resources,pom.xml
detect.blackduck.signature.scanner.exclusion.patterns=**/test/**,**/target/**,**/*.log,**/*.tmp

# Timeout Configuration
detect.timeout=900
detect.api.timeout=300

# Output Configuration
detect.output.path=./blackduck-output
detect.cleanup=false

# Report Configuration
detect.risk.report.pdf=true
detect.notices.report=true
detect.policy.check.fail.on.severities=CRITICAL,HIGH
detect.blackduck.signature.scanner.snippet.matching=SNIPPET_MATCHING

# Component Matching
detect.bdio.output.path=./blackduck-output/bdio
detect.code.location.name=customer-service-${BUILD_NUMBER:-local}

# Maven Specific Configuration
detect.maven.include.plugins=true
detect.maven.scope=compile,runtime
detect.packagist.include.dev.dependencies=false

# Logging Configuration
logging.level.com.synopsys.integration=INFO
detect.diagnostic=false
detect.diagnostic.extended=false

# Policy Configuration
detect.policy.check=true
detect.ignore.failure=false

# License Configuration
detect.notices.report.path=./blackduck-output/notices

# Vulnerability Configuration
detect.tools.excluded=POLARIS
detect.tools=DETECTOR,SIGNATURE_SCAN

# Performance Configuration
detect.parallel.processors=4
detect.blackduck.signature.scanner.memory=4096

# Custom Properties for Virtual Thread Analysis
detect.project.user.groups=java-developers,security-team
detect.project.tags=java21,virtual-threads,spring-boot,microservice

# Exclusions for False Positives
detect.blackduck.signature.scanner.exclusion.name.patterns=
  *test*,
  *Test*,
  *junit*,
  *mockito*,
  *hamcrest*,
  *assertj*,
  *testcontainers*

# Component Policy Overrides
detect.component.policy.severities.enabled=CRITICAL,HIGH,MEDIUM

# Risk Report Configuration
detect.risk.report.pdf.path=./blackduck-output/risk-report.pdf

# Notice Report Configuration  
detect.notices.report.path=./blackduck-output/notices.txt

# BDIO Configuration
detect.bdio2.enabled=true

# Docker Configuration (if using containerized scanning)
detect.docker.inspector.version=latest
detect.docker.platform.top.layer.id.disabled=false

# Custom Maven Wrapper Configuration
detect.maven.wrapper.path=./mvnw