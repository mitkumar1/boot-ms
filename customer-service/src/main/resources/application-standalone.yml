server:
  port: 4041

spring:
  application:
    name: customer-service

  # Database config
  datasource:
    url: jdbc:h2:mem:customer_data
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Enabling the H2 console
  h2:
    console:
      enabled: true
      path: /h2-console

# Disable Eureka for standalone testing  
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# Actuator Configuration for Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans
  endpoint:
    health:
      show-details: always